<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cash Out Button Control Panel</title>
    <style>
        #success-message {
            transition: opacity 1s ease-out;
        }
    </style>
    <script>
        function toggleInteractableCheckbox() {
            const visibleCheckbox = document.getElementById('visible');
            const interactableCheckbox = document.getElementById('interactable');
            interactableCheckbox.disabled = !visibleCheckbox.checked;
        }

        window.onload = function () {
            toggleInteractableCheckbox();

            const successMsg = document.getElementById('success-message');
            if (successMsg) {
                setTimeout(() => {
                    successMsg.style.opacity = '0';
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 1000);
                }, 1000);
            }
        };
    </script>
</head>
<body>
    <h2>Cash Out Button Control Panel</h2>

    {% if success %}
        <p id="success-message" style="color: green;">Settings updated successfully!</p>
    {% endif %}

    <form method="post" action="/update_cashout_status">
        <label>
            <input type="checkbox" id="visible" name="visible" {% if CASH_OUT_BUTTON_VISIBLE %}checked{% endif %} onchange="toggleInteractableCheckbox()">
            Cash Out Button Visible
        </label><br>
        <label>
            <input type="checkbox" id="interactable" name="interactable" {% if CASH_OUT_BUTTON_INTERACTABLE %}checked{% endif %}>
            Cash Out Button Interactable
        </label><br><br>

        <button type="submit">Update</button>
        <a href="/">Go Back</a>
    </form>
</body>
</html>
