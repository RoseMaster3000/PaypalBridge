<div style="
    border: 2px solid #ccc;
    border-radius: 8px;
    padding: 15px;
    margin: 15px 0;
    background: #f9f9f9;
    width: 650px;

">
{% include 'wallet_status-description.html' %}

    <h2>Age Restriction Settings</h2>

    <form method="post" action="/update_wallet_status">

        <label>
            <input type="checkbox" name="enabled" {% if enabled %}checked{% endif %}>
            Enable Age Restriction System
        </label>
        <br><br>

        <label>
            Minimum Age:
            <input type="number" name="min_age" value="{{ min_age }}">
        </label>
        <br><br>

        <label>
            User Age:
            <input type="number" name="user_age" value="{{ user_age }}">
        </label>
        <br><br>

        <label>
            <input type="checkbox" name="hide_all" {% if hide_all %}checked{% endif %}>
            Hide All Buttons When Underage
        </label>
        <br><br>

        <button type="submit">Save</button>
        <a href="/">Go Back</a>

    </form>

</div>
