<!DOCTYPE html>
<html>
<head>
    <title>Wallet Status</title>

    

    <style>
        .frame-box {
            max-width: 650px;
            margin: 20px 0px;
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: #f9f9f9;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

<div class="frame-box">

    <!-- Collapsible help box -->
    {% include 'wallet_status-description.html' %}

    <!-- Main form -->
    <form method="POST" action="/update_wallet_status">

        <label>
            <input type="checkbox" name="enabled" {% if age_restriction_enabled %}checked{% endif %}>
            Enable Age Restriction System
        </label>
        <br><br>

        <label>Minimum Age:</label>
        <input type="number" name="min_age" value="{{ min_age }}" min="1" max="99">
        <br><br>

        <label>User Age:</label>
        <input type="number" name="user_age" value="{{ user_age }}" min="1" max="99">
        <br><br>

        <button type="submit">Save</button>
        <a href="/">Go Back</a>
    </form>

</div>

</body>
</html>
