<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wallet Button Control Panel</title>
    <style>
        #success-message {
            transition: opacity 1s ease-out;
        }
    </style>
    <script>
        function toggleInteractableCheckbox() {
            const visibleCheckbox = document.getElementById('visible');
            const interactableCheckbox = document.getElementById('interactable');
            interactableCheckbox.disabled = !visibleCheckbox.checked;
        }

        window.onload = function () {
            toggleInteractableCheckbox();

            // Auto-hide success message with a fade-out effect
            const successMsg = document.getElementById('success-message');
            if (successMsg) {
                setTimeout(() => {
                    successMsg.style.opacity = '0'; // Fade out smoothly
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 1000); // Wait for fade-out completion
                }, 1000); //3000 miliseconds 3-seconds
            }
        };
    </script>
</head>
<body>
    <h2>Wallet Button Control Panel</h2>

    {% if success %}
        <p id="success-message" style="color: green;">Settings updated successfully!</p>
    {% endif %}

    <form method="post" action="/update_wallet_status">
        <label>
            <input type="checkbox" id="visible" name="visible" {% if WALLET_BUTTON_VISIBLE %}checked{% endif %} onchange="toggleInteractableCheckbox()">
            Wallet Button Visible
        </label><br>
        <label>
            <input type="checkbox" id="interactable" name="interactable" {% if WALLET_BUTTON_INTERACTABLE %}checked{% endif %}>
            Wallet Button Interactable
        </label><br>
        <label>
            <input type="checkbox" id="cash_out_interactable" name="cash_out_interactable" {% if CASH_OUT_BUTTON_INTERACTABLE %}checked{% endif %}>
            Cash Out Button Interactable
        </label><br>
        <br>
        <button type="submit">Update</button>
        <a href="/">Go Back</a>


    </form>
</body>
</html>
