<hr class="left-divider">
<h2>Upload app-add.txt</h2>
<form action="/upload_appad" method="post" enctype="multipart/form-data">
    <div class="form-group">
        <label for="upload-file"> Select new app-ads.txt:</label>
        <input type="file" name="file" id="upload-file" required>
    </div>

    <div class="form-group form-actions">
        <label for="upload-password">Password:</label>
        <input type="password" name="password" id="upload-password" required>
        <br>
        <button type="submit">Confirm Upload</button>
        <a href='/forgot_appad_password'><small>Forgot Password?</small></a>
    </div>
</form>


<hr class="left-divider">
<h2>Remove app-add.txt</h2>
<form action="/remove_appad" method="post">
    <div class="form-group form-actions">
        <label for="remove-password">Password:</label>
        <input type="password" name="password" id="remove-password" required>
        <br>
        <button type="submit">Confirm Deletion</button>
        <a href='/forgot_appad_password'><small>Forgot Password?</small></a>
    </div>
</form>



<hr class="left-divider">
<h2>Modify app-add.txt</h2>
<form action="/modify_appad" method="post">
    <div class="form-group">       
    <textarea name="content" id="modify-content" rows="10" cols="30">copy&Paste new content here
    </textarea>
            
    </div>
    <div class="form-group form-actions">
        <label for="modify-password">Password:</label>
        <input type="password" name="password" id="modify-password" required>
        <br>
        <button type="submit">Confirm Modification</button>
        <a href='/forgot_appad_password'><small>Forgot Password?</small></a>
    </div>
    </form>
<hr/>
