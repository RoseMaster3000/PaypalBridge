<h1>Users</h1>

<form method="POST" action="/DeleteUsers">  


<table id="userTable" class="display">
  <thead>
    <tr>
      <th>Username</th>
      <th>Email</th>
      <th>Gems</th>
      <th>Redeemed Cashouts</th>
      <th>Rewarded</th>
      <th>Interstitial</th>
      <th>Creation Time</th>
      <th>Delete</th>
    </tr>
  </thead>
  <tbody></tbody>
  <tfoot>
  <tr>
    <th></th>
    <th></th>
    <th></th>
    <th></th>
    <th></th>
    <th></th>
    <th></th>
    <th><button type="submit">Delete</button></th>
  </tr>
</tfoot>
</table>

</form>


<!-- Javascript  -->
<script>
$(document).ready(function() {
  $('#userTable').DataTable({
    "ajax": {
      "url": "/api/users", // API
      "dataSrc": ""// JSON root
    },
    // The 'data' field should match the keys in JSON
    "columns": [
      {"data": "username"}, 
      {"data": "email"},
      {"data": "gems"},
      {"data": "total_cashout"},
      {"data": "rewarded"},
      {"data": "intersitial"},
      {"data": "created_at"},
      {"data": null, "orderable": false, "render": generateDeleteBox}
    ],
    "footerCallback": grandTotalCashout
  });
});


function grandTotalCashout(row, data, start, end, display) {
  // get DataTable API (so we can modify the table)
  var api = this.api();

  // Calculate total of total_cashout column (index 3)
  var total = api
    .column(3)
    .data()
    .reduce(function(acc, val) {
      return acc + parseFloat(val || 0);
    }, 0);

  // Put Grand total in footer
  $(api.column(3).footer()).html(
    'Total: $' + total.toFixed(2)
  );
}


function generateDeleteBox(data, type, row) {
  return `
    <input
        type="checkbox"
        name="usernames"
        value="${data.username}"
    />
  `
}
</script>
